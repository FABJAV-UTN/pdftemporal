# Levanta la API y MongoDB para desarrollo:  docker compose up --build
# La configuración sale de variables de entorno (12-Factor III); ver .env.example.
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-pdf_extraction_db}
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB:-10}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
