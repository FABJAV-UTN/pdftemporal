[project]
name = "pdf-extractext"
version = "0.1.0"
description = "API REST para extraer el texto de archivos PDF y gestionarlos (CRUD) en MongoDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie==1.26.0",
    "fastapi[standard]>=0.136.1",
    "motor>=3.7.1",
    "pdfplumber>=0.11.9",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
